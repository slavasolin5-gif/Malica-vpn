name: Build Happ APK (Hardcore Native Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Project and Inject Native Code
        run: |
          flutter create --org com.example.happ happ_temp
          cp -r happ_temp/* .
          rm -rf happ_temp
          flutter pub add http

          # --- 1. DART КОД: Интерфейс и MethodChannel ---
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;

          void main() => runApp(const HappApp());

          class HappApp extends StatelessWidget {
            const HappApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF090B0F),
                  cardColor: const Color(0xFF131722),
                ),
                home: const DashboardScreen(),
              );
            }
          }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});
            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> with SingleTickerProviderStateMixin {
            // Канал связи с нативным кодом Kotlin
            static const platform = MethodChannel('com.happ.vpn/engine');
            
            bool isConnected = false;
            bool isConnecting = false;
            String activeServer = "Нет серверов";
            late AnimationController _pulse;

            @override
            void initState() {
              super.initState();
              _pulse = AnimationController(vsync: this, duration: const Duration(seconds: 2));
            }

            Future<void> _fetchSub() async {
              setState(() => activeServer = "Загрузка подписки...");
              try {
                // Сюда вшита ваша подписка
                final url = "https://sub.nextgencloud.space/RhJ5gaM2gf5LHc4B";
                final response = await http.get(Uri.parse(url));
                if (response.statusCode == 200) {
                  setState(() => activeServer = "Подписка загружена (готов к маршрутизации)");
                }
              } catch (e) {
                setState(() => activeServer = "Ошибка загрузки сети");
              }
            }

            Future<void> _toggleVpn() async {
              if (isConnecting) return;
              setState(() => isConnecting = true);

              try {
                if (isConnected) {
                  // Отправляем команду в Kotlin на остановку туннеля
                  await platform.invokeMethod('stopVpn');
                  _pulse.stop();
                  _pulse.reset();
                  setState(() {
                    isConnected = false;
                    isConnecting = false;
                  });
                } else {
                  // Отправляем команду в Kotlin на запуск туннеля
                  final result = await platform.invokeMethod('startVpn');
                  if (result == true) {
                    _pulse.repeat();
                    setState(() {
                      isConnected = true;
                      isConnecting = false;
                    });
                  }
                }
              } on PlatformException catch (e) {
                print("Ошибка нативного моста: ${e.message}");
                setState(() => isConnecting = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: const Text('HAPP CORE', style: TextStyle(fontWeight: FontWeight.w800, fontSize: 14)),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.download_rounded),
                      onPressed: _fetchSub,
                    )
                  ],
                ),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(activeServer, style: const TextStyle(color: Colors.white70)),
                      const SizedBox(height: 60),
                      GestureDetector(
                        onTap: _toggleVpn,
                        child: SizedBox(
                          width: 200, height: 200,
                          child: Stack(
                            alignment: Alignment.center,
                            children: [
                              if (isConnected)
                                AnimatedBuilder(
                                  animation: _pulse,
                                  builder: (ctx, child) => Container(
                                    width: 150 + (_pulse.value * 50),
                                    height: 150 + (_pulse.value * 50),
                                    decoration: BoxDecoration(
                                      shape: BoxShape.circle,
                                      border: Border.all(color: Colors.green.withOpacity(1 - _pulse.value), width: 2),
                                    ),
                                  ),
                                ),
                              Container(
                                width: 150, height: 150,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: const Color(0xFF131722),
                                  border: Border.all(color: isConnected ? Colors.green : Colors.blue, width: 2),
                                ),
                                child: Center(
                                  child: isConnecting 
                                    ? const CircularProgressIndicator(color: Colors.white)
                                    : Icon(Icons.power_settings_new, size: 50, color: isConnected ? Colors.green : Colors.white),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # --- 2. ANDROID MANIFEST: Права системного VPN ---
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.BIND_VPN_SERVICE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<service android:name=".CoreVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false"><intent-filter><action android:name="android.net.VpnService" \/><\/intent-filter><\/service><\/application>/' android/app/src/main/AndroidManifest.xml

          # --- 3. KOTLIN КОД: MainActivity (Слушатель команд от Dart) ---
          cat << 'EOF' > android/app/src/main/kotlin/com/example/happ/MainActivity.kt
          package com.example.happ

          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.content.Intent
          import android.net.VpnService

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.happ.vpn/engine"

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "startVpn") {
                          val intent = VpnService.prepare(this)
                          if (intent != null) {
                              startActivityForResult(intent, 0)
                          } else {
                              startService(Intent(this, CoreVpnService::class.java))
                          }
                          result.success(true)
                      } else if (call.method == "stopVpn") {
                          startService(Intent(this, CoreVpnService::class.java).setAction("STOP"))
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
              
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 0 && resultCode == RESULT_OK) {
                      startService(Intent(this, CoreVpnService::class.java))
                  }
              }
          }
          EOF

          # --- 4. KOTLIN КОД: CoreVpnService (Создание сетевого интерфейса tun0) ---
          cat << 'EOF' > android/app/src/main/kotlin/com/example/happ/CoreVpnService.kt
          package com.example.happ

          import android.net.VpnService
          import android.content.Intent
          import android.os.ParcelFileDescriptor

          class CoreVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      vpnInterface?.close()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  
                  try {
                      val builder = Builder()
                      builder.addAddress("172.19.0.1", 30) // Локальный IP туннеля
                      builder.addRoute("0.0.0.0", 0)       // Перехват всего трафика
                      builder.addDnsServer("1.1.1.1")
                      builder.setSession("Happ Tunnel")
                      
                      // Исключаем само приложение, чтобы не зациклить трафик
                      builder.addDisallowedApplication(packageName)
                      
                      vpnInterface = builder.establish()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  
                  return START_STICKY
              }
              
              override fun onDestroy() {
                  super.onDestroy()
                  vpnInterface?.close()
              }
          }
          EOF

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happ-hardcore-apk
          path: build/app/outputs/flutter-apk/app-release.apk
