name: Build Happ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Flutter Project and Inject Code
        run: |
          # 1. Создаем чистый проект Flutter
          flutter create --org com.example.happ happ_temp
          cp -r happ_temp/* .
          rm -rf happ_temp

          # 2. Перезаписываем lib/main.dart полным кодом интерфейса Happ
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const HappApp());
          }

          class HappApp extends StatelessWidget {
            const HappApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Happ VPN',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF090B0F),
                  cardColor: const Color(0xFF131722),
                ),
                home: const DashboardScreen(),
              );
            }
          }

          enum RouteMode { rule, global, direct }

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen>
              with SingleTickerProviderStateMixin {
            bool isConnected = false;
            bool isConnecting = false;
            RouteMode selectedRouteMode = RouteMode.rule;
            late AnimationController _pulseController;

            @override
            void initState() {
              super.initState();
              _pulseController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              );
            }

            @override
            void dispose() {
              _pulseController.dispose();
              super.dispose();
            }

            void _toggleConnection() async {
              if (isConnecting) return;

              if (!isConnected) {
                setState(() => isConnecting = true);
                await Future.delayed(const Duration(milliseconds: 600));
                setState(() {
                  isConnecting = false;
                  isConnected = true;
                });
                _pulseController.repeat();
              } else {
                _pulseController.stop();
                _pulseController.reset();
                setState(() => isConnected = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              const bgDark = Color(0xFF090B0F);
              const cardDark = Color(0xFF131722);
              const accentGreen = Color(0xFF00E676);
              const accentBlue = Color(0xFF3B82F6);
              final activeColor = isConnected ? accentGreen : accentBlue;

              return Scaffold(
                backgroundColor: bgDark,
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                        decoration: BoxDecoration(
                          color: activeColor.withOpacity(0.15),
                          borderRadius: BorderRadius.circular(8),
                          border: Border.all(color: activeColor.withOpacity(0.4)),
                        ),
                        child: const Text(
                          'HAPP CORE',
                          style: TextStyle(
                            fontSize: 13,
                            fontWeight: FontWeight.w800,
                            letterSpacing: 1.4,
                            color: Colors.white,
                          ),
                        ),
                      ),
                      const Spacer(),
                      IconButton(
                        icon: const Icon(Icons.qr_code_scanner_rounded, color: Colors.white70),
                        onPressed: () {},
                      ),
                      IconButton(
                        icon: const Icon(Icons.tune_rounded, color: Colors.white70),
                        onPressed: () {},
                      ),
                    ],
                  ),
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 12),
                    child: Column(
                      children: [
                        _buildRouteModeSelector(cardDark, activeColor),
                        const Spacer(),
                        GestureDetector(
                          onTap: _toggleConnection,
                          child: SizedBox(
                            width: 220,
                            height: 220,
                            child: Stack(
                              alignment: Alignment.center,
                              children: [
                                if (isConnected)
                                  AnimatedBuilder(
                                    animation: _pulseController,
                                    builder: (context, child) {
                                      return Container(
                                        width: 170 + (_pulseController.value * 50),
                                        height: 170 + (_pulseController.value * 50),
                                        decoration: BoxDecoration(
                                          shape: BoxShape.circle,
                                          border: Border.all(
                                            color: accentGreen.withOpacity(1 - _pulseController.value),
                                            width: 2.5,
                                          ),
                                        ),
                                      );
                                    },
                                  ),
                                AnimatedContainer(
                                  duration: const Duration(milliseconds: 350),
                                  width: 165,
                                  height: 165,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    gradient: RadialGradient(
                                      colors: isConnected
                                          ? [accentGreen.withOpacity(0.28), cardDark]
                                          : [accentBlue.withOpacity(0.18), cardDark],
                                    ),
                                    boxShadow: [
                                      BoxShadow(
                                        color: activeColor.withOpacity(isConnected ? 0.35 : 0.12),
                                        blurRadius: 32,
                                        spreadRadius: 4,
                                      )
                                    ],
                                    border: Border.all(
                                      color: activeColor.withOpacity(0.85),
                                      width: 2.5,
                                    ),
                                  ),
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      if (isConnecting)
                                        const SizedBox(
                                          width: 36,
                                          height: 36,
                                          child: CircularProgressIndicator(
                                            strokeWidth: 3,
                                            color: Colors.white,
                                          ),
                                        )
                                      else
                                        Icon(
                                          Icons.power_settings_new_rounded,
                                          size: 54,
                                          color: isConnected ? accentGreen : Colors.white,
                                        ),
                                      const SizedBox(height: 10),
                                      Text(
                                        isConnecting
                                            ? 'ЗАПУСК...'
                                            : (isConnected ? 'ПОДКЛЮЧЕНО' : 'ОТКЛЮЧЕНО'),
                                        style: TextStyle(
                                          fontSize: 12,
                                          fontWeight: FontWeight.w700,
                                          letterSpacing: 1.2,
                                          color: isConnected ? accentGreen : Colors.white70,
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const Spacer(),
                        _buildTrafficRow(cardDark, isConnected),
                        const SizedBox(height: 16),
                        _buildSelectedNodeCard(cardDark, accentGreen),
                        const SizedBox(height: 12),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildRouteModeSelector(Color cardDark, Color activeColor) {
              final modes = {
                RouteMode.rule: 'Умный (RU напрямую)',
                RouteMode.global: 'Весь трафик',
                RouteMode.direct: 'Напрямую',
              };

              return Container(
                padding: const EdgeInsets.all(4),
                decoration: BoxDecoration(
                  color: cardDark,
                  borderRadius: BorderRadius.circular(14),
                  border: Border.all(color: Colors.white10),
                ),
                child: Row(
                  children: modes.entries.map((entry) {
                    final isSelected = selectedRouteMode == entry.key;
                    return Expanded(
                      child: GestureDetector(
                        onTap: () => setState(() => selectedRouteMode = entry.key),
                        child: AnimatedContainer(
                          duration: const Duration(milliseconds: 200),
                          padding: const EdgeInsets.symmetric(vertical: 10),
                          decoration: BoxDecoration(
                            color: isSelected ? activeColor.withOpacity(0.2) : Colors.transparent,
                            borderRadius: BorderRadius.circular(10),
                            border: isSelected ? Border.all(color: activeColor.withOpacity(0.6)) : null,
                          ),
                          child: Text(
                            entry.value,
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 11,
                              fontWeight: isSelected ? FontWeight.w700 : FontWeight.w500,
                              color: isSelected ? Colors.white : Colors.white54,
                            ),
                          ),
                        ),
                      ),
                    );
                  }).toList(),
                ),
              );
            }

            Widget _buildTrafficRow(Color cardDark, bool connected) {
              return Row(
                children: [
                  Expanded(
                    child: Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: cardDark,
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: Colors.white10),
                      ),
                      child: Row(
                        children: [
                          const Icon(Icons.arrow_downward_rounded, color: Color(0xFF00E676), size: 22),
                          const SizedBox(width: 12),
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text('СКАЧИВАНИЕ', style: TextStyle(fontSize: 10, color: Colors.white54)),
                              const SizedBox(height: 4),
                              Text(
                                connected ? '14.8 MB/s' : '0 KB/s',
                                style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                  const SizedBox(width: 12),
                  Expanded(
                    child: Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: cardDark,
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: Colors.white10),
                      ),
                      child: Row(
                        children: [
                          const Icon(Icons.arrow_upward_rounded, color: Color(0xFF3B82F6), size: 22),
                          const SizedBox(width: 12),
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              const Text('ОТДАЧА', style: TextStyle(fontSize: 10, color: Colors.white54)),
                              const SizedBox(height: 4),
                              Text(
                                connected ? '3.2 MB/s' : '0 KB/s',
                                style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }

            Widget _buildSelectedNodeCard(Color cardDark, Color accentGreen) {
              return Container(
                padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 16),
                decoration: BoxDecoration(
                  color: cardDark,
                  borderRadius: BorderRadius.circular(18),
                  border: Border.all(color: Colors.white12),
                ),
                child: Row(
                  children: [
                    Container(
                      width: 42,
                      height: 42,
                      alignment: Alignment.center,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.06),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: const Text('🇩🇪', style: TextStyle(fontSize: 22)),
                    ),
                    const SizedBox(width: 14),
                    const Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '🇩🇪 Frankfurt • Reality XTLS',
                            style: TextStyle(fontSize: 14, fontWeight: FontWeight.w700, color: Colors.white),
                          ),
                          SizedBox(height: 4),
                          Text(
                            'VLESS • REALITY • TCP',
                            style: TextStyle(fontSize: 10, fontWeight: FontWeight.w600, color: Colors.white54),
                          ),
                        ],
                      ),
                    ),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                      decoration: BoxDecoration(
                        color: accentGreen.withOpacity(0.15),
                        borderRadius: BorderRadius.circular(10),
                      ),
                      child: Text(
                        '42 ms',
                        style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: accentGreen),
                      ),
                    ),
                    const SizedBox(width: 6),
                    const Icon(Icons.chevron_right_rounded, color: Colors.white54),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happ-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
